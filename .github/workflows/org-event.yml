name: org-event
# The T3b router (contract /tmp/webhook-relay/contract.md §3, amended by §7 and §8): the relay
# (T3a) dispatches this with 5 string IDs taken from a signed webhook payload. Nothing here trusts
# those IDs -- the `verify` job re-fetches the comment, the PR, and org membership itself through
# gateway/trigger.py before anything is allowed to run. §8: the trigger word is `@review`, and the
# comment may also pick a MODEL/EFFORT, resolved against gateway/models.json in this checkout and
# passed on as `backend`/`model`/`effort`. A failed check ends the job successfully with a log
# line; nothing is posted and nothing is revealed to the commenter.
#
# §7 "Validate inputs BEFORE any mint": the `validate` step runs trigger.py's format + owner-pin
# checks (no App token, no network) before the mint step exists at all, and hands the mint step
# the validated repo name. The mint itself always pins `owner: ${{ github.repository_owner }}`,
# never anything taken from the inputs.

on:
  workflow_dispatch:
    inputs:
      event:
        description: The GitHub event name from the relay (v1 only issue_comment).
        required: true
        type: string
      repository:
        description: owner/name of the repo the event came from.
        required: true
        type: string
      number:
        description: The issue or PR number, digits.
        required: true
        type: string
      comment_id:
        description: The comment id, digits.
        required: true
        type: string
      delivery_id:
        description: The X-GitHub-Delivery GUID.
        required: true
        type: string

permissions: {}

concurrency:
  group: org-event-${{ inputs.comment_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: gateway
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.validate.outputs.valid == 'false' && 'false' || steps.run-trigger.outputs.verified }}
      repository: ${{ steps.run-trigger.outputs.repository }}
      pr_number: ${{ steps.run-trigger.outputs.pr_number }}
      head_sha: ${{ steps.run-trigger.outputs.head_sha }}
      comment_id: ${{ steps.run-trigger.outputs.comment_id }}
      command: ${{ steps.run-trigger.outputs.command }}
      requester: ${{ steps.run-trigger.outputs.requester }}
      backend: ${{ steps.run-trigger.outputs.backend }}
      model: ${{ steps.run-trigger.outputs.model }}
      effort: ${{ steps.run-trigger.outputs.effort }}
    steps:
      - name: Check out board-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate inputs (format + owner pin) -- before any mint
        id: validate
        env:
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_COMMENT_ID: ${{ inputs.comment_id }}
          INPUT_DELIVERY_ID: ${{ inputs.delivery_id }}
        run: python3 gateway/trigger.py validate

      # §7 "Router mint": permission-members/pull-requests/issues read, repositories scoped to
      # the single validated target name, owner always the repo this workflow lives in.
      - name: Mint Board App token (target repo, read)
        id: mint
        if: steps.validate.outputs.valid == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.validate.outputs.name }}
          permission-members: read
          permission-pull-requests: read
          permission-issues: read

      - name: Run gateway/trigger.py
        id: run-trigger
        if: steps.validate.outputs.valid == 'true'
        env:
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_COMMENT_ID: ${{ inputs.comment_id }}
          INPUT_DELIVERY_ID: ${{ inputs.delivery_id }}
          BOARD_APP_TOKEN: ${{ steps.mint.outputs.token }}
          BOARD_APP_BOT_LOGIN: ${{ steps.mint.outputs.app-slug && format('{0}[bot]', steps.mint.outputs.app-slug) }}
        run: python3 gateway/trigger.py run

      - name: Log verify result
        env:
          VALID: ${{ steps.validate.outputs.valid }}
          VALIDATE_REASON: ${{ steps.validate.outputs.reason }}
          VERIFIED: ${{ steps.run-trigger.outputs.verified }}
          REASON: ${{ steps.run-trigger.outputs.reason }}
        run: |
          if [ "$VALID" = "false" ]; then
            echo "verify: failed validation ($VALIDATE_REASON)"
          elif [ "$VERIFIED" = "true" ]; then
            echo "verify: passed"
          else
            echo "verify: failed ($REASON)"
          fi

  review:
    needs: verify
    if: needs.verify.outputs.verified == 'true'
    # The caller caps the callee's GITHUB_TOKEN, not its App token (independent and minted
    # per-job by the callee) -- so this grants only what the callee's own jobs declare for
    # GITHUB_TOKEN, which is contents: read.
    permissions:
      contents: read
    uses: ./.github/workflows/ai-review.yml
    with:
      repository: ${{ needs.verify.outputs.repository }}
      pr_number: ${{ needs.verify.outputs.pr_number }}
      head_sha: ${{ needs.verify.outputs.head_sha }}
      comment_id: ${{ needs.verify.outputs.comment_id }}
      requester: ${{ needs.verify.outputs.requester }}
      backend: ${{ needs.verify.outputs.backend }}
      model: ${{ needs.verify.outputs.model }}
      effort: ${{ needs.verify.outputs.effort }}
    # No `secrets:` block: an Environment's secrets (BOARD_APP_PRIVATE_KEY, OPENROUTER_API_KEY)
    # can't be passed through a workflow_call in the first place -- the callee's own jobs declare
    # `environment:` themselves and pick their secrets up directly.
